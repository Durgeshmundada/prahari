frr defaults traditional
hostname dc-edge
log stdout informational
service integrated-vtysh-config
!
interface eth1
 ip address 10.10.3.2/30
 ip ospf area 0.0.0.0
!
interface eth2
 ip address 10.20.1.2/30
 ip ospf area 0.0.0.0
 ip ospf cost 100
!
interface eth3
 ip address 172.16.20.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.6
!
line vty
