# Host nginx template. Supply a trusted certificate and replace the server name.
# Keep the dashboard Compose port bound to 127.0.0.1.
server {
    listen 443 ssl;
    server_name prahari.example;
    ssl_certificate /etc/prahari/tls/fullchain.pem;
    ssl_certificate_key /etc/prahari/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
