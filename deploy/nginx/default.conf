server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 21m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/login {
        client_max_body_size 4k;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header X-Request-Id $request_id;
    }

    # The dashboard calls this separately from /health. Without an exact proxy
    # location nginx would try to serve it as a static file and return HTTP 404.
    location = /readyz {
        proxy_pass http://api:8080/readyz;
        proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
