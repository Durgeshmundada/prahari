# Mount on an approved internal monitoring host/network; no public metrics proxy.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
rule_files:
  - prahari.rules.yaml
scrape_configs:
  - job_name: prahari-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prahari_monitor_token
    static_configs:
      - targets: [api:8080]
# Configure the customer-controlled Alertmanager and TLS when crossing hosts.
